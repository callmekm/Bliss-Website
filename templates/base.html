<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bliss Lounge Bar</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Main CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<header class="site-header">
    <div class="nav-wrapper">

        <!-- LOGO -->
        <div class="logo">
            <a href="{{ url_for('home') }}">
                <img src="{{ url_for('static', filename='bliss-logo.png') }}" alt="Bliss">
            </a>
        </div>

        <!-- BURGER -->
        <div class="burger" id="burger">
            <span></span>
            <span></span>
            <span></span>
        </div>

        <!-- NAV -->
        <nav class="nav" id="nav">
            <a href="{{ url_for('home') }}">Home</a>
            <a href="{{ url_for('menu') }}">Menu</a>
            <a href="{{ url_for('reserve_map') }}">Reserve</a>
            <a href="#contact">Contact</a>
        </nav>

    </div>
</header>

<script>
const burger = document.getElementById("burger");
const nav = document.getElementById("nav");

burger.addEventListener("click", () => {
    nav.classList.toggle("active");
    burger.classList.toggle("open");
});
</script>

<!-- 🔽 PAGE CONTENT -->
<main>
    {% block content %}{% endblock %}
</main>

<!-- 🔻 FOOTER -->
<footer class="footer">
    <div class="footer-container">

        <!-- LEFT: BRAND -->
        <div class="footer-brand">
            <img src="{{ url_for('static', filename='bliss-logo.png') }}" alt="Bliss">
            <p>Fresh food, cocktails and a cozy atmosphere for unforgettable moments.</p>
        </div>

        <!-- CENTER: LOCATION -->
        <div class="footer-col">
    <h4>Location</h4>
    <p>Strumica, North Macedonia</p>
    <p>Main Street 123</p>
</div>

<div class="footer-col">
    <h4>Contact</h4>
    <p>📞 071 251 690</p>
    <p>📧 info@bliss.mk</p>
    <p>Instagram: @bliss</p>
</div>

    </div>

    <!-- BOTTOM BAR -->
    <div class="footer-bottom">
        <p>© 2026 Bliss Lounge Bar. All rights reserved.</p>
    </div>
</footer>
